<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1>Personal Profile</h1>
        <form action="ProfileServlet" method="post">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" name="studentId" required>

            <label for="programme">Programme</label>
            <input type="text" id="programme" name="programme" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="hobbies">Hobbies</label>
            <input type="text" id="hobbies" name="hobbies" required>

            <label for="intro">Short Self Introduction</label> 
            <textarea id="intro" name="intro" rows="4" required></textarea> <!--to fit in-->

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
